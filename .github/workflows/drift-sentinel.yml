name: drift-sentinel

# Weekly hygiene check. Runs the drift-sentinel script (money/vocab/dash) and,
# ONLY if it finds something, opens a GitHub Issue assigned to the repo owner —
# which GitHub then emails + pushes to the GitHub mobile app. Clean week = silence.
#
# Scheduled jobs only run from the default branch (main), so this file lives on
# main, but it checks out the platform/v2-foundation branch to run the actual
# check (that's where the script lives).

on:
  schedule:
    - cron: "0 8 * * 0" # Sundays 08:00 UTC = 6pm Sydney (AEST)
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the platform branch (where the script lives)
        uses: actions/checkout@v4
        with:
          ref: platform/v2-foundation

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The script only uses Node built-ins (fs/path), so no install is needed.
      - name: Run drift sentinel
        id: drift
        run: |
          set +e
          node scripts/drift-sentinel.js --strict | tee drift-report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open an issue if drift was found
        if: steps.drift.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift-report.txt', 'utf8').trim();
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Drift detected — ${today}`,
              assignees: [context.repo.owner],
              body: [
                'The weekly **drift-sentinel** check found something that needs a look.',
                '',
                '```',
                report,
                '```',
                '',
                'To clear it: open a Claude Code session on `platform/v2-foundation` and say **"fix the drift"** — Claude will read the correct figures off `CALCULATIONS.md`, fix any vocab/dashes, and show you a diff before committing.',
              ].join('\n'),
            });
